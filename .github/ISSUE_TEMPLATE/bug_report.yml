name: Báo lỗi SmoothMine Launcher
description: Báo lỗi văng game, tụt FPS hoặc lỗi giao diện trên SmoothMine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Dòng điện thoại & Chip GPU
      placeholder: "Ví dụ: Redmi Note 12 Turbo - Snapdragon 7+ Gen 2 / RAM 8GB"
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Phiên bản Minecraft & Chế độ SmoothBoost
      placeholder: "Ví dụ: SmoothBoost 1.20.1 (Fabric + Sodium) - Chế độ Cân Bằng"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Mô tả chi tiết hoặc đính kèm latestlog.txt
      description: "File `latestlog.txt` nằm tại `/storage/emulated/0/Android/data/vn.smoothmine.launcher/files/` (hoặc bấm nút Chia sẻ Log ngay trên màn hình chính của SmoothMine)."
    validations:
      required: true
