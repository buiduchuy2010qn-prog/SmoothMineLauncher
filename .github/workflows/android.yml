name: SmoothMine Android Build & Release

on:
  push:
    branches:
      - 'v3_openjdk'
      - 'main'
    tags:
      - 'v*'
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Tự động tạo trang tải GitHub Release mới sau khi build xong?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Mã phiên bản Release (ví dụ: v1.0.1 - chỉ dùng khi bật Publish Release)'
        required: false
        default: 'v1.0.1'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout SmoothMine Source
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Try Download JRE 8 Artifact
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Ensure Bundled JRE 8 (Public Release Fallback)
        run: |
          JRE_DIR="app_pojavlauncher/src/main/assets/components/jre"
          mkdir -p "$JRE_DIR"
          if [ ! -f "$JRE_DIR/version" ] || [ ! -f "$JRE_DIR/bin-arm64.tar.xz" ]; then
            echo "Packaging JRE 8 from public OpenJDK release..."
            mkdir -p /tmp/empty_universal
            tar -cJf "$JRE_DIR/universal.tar.xz" -C /tmp/empty_universal .
            BASE_URL="https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre8"
            curl -fSL "$BASE_URL/jre8-android-arm64.tar.xz" -o "$JRE_DIR/bin-arm64.tar.xz"
            curl -fSL "$BASE_URL/jre8-android-arm.tar.xz" -o "$JRE_DIR/bin-arm.tar.xz"
            curl -fSL "$BASE_URL/jre8-android-x86.tar.xz" -o "$JRE_DIR/bin-x86.tar.xz"
            curl -fSL "$BASE_URL/jre8-android-x86_64.tar.xz" -o "$JRE_DIR/bin-x86_64.tar.xz"
            echo "smoothmine-jre8-2026" > "$JRE_DIR/version"
          fi
          ls -lh "$JRE_DIR"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Prepare Language List & Output Dir
        run: |
          sed -i 's/\r$//' ./scripts/languagelist_updater.sh
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Determine Version Label
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ inputs.publish_release }}" == "true" && -n "${{ inputs.release_tag }}" ]]; then
            VER="${{ inputs.release_tag }}"
          else
            VER="v1.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build Signed SmoothMine Release APK
        run: |
          gradle :app_pojavlauncher:assembleRelease --no-daemon
          cp app_pojavlauncher/build/outputs/apk/release/*.apk "out/SmoothMine-${{ steps.ver.outputs.version }}-release.apk"
          md5sum "out/SmoothMine-${{ steps.ver.outputs.version }}-release.apk" > "out/SmoothMine-${{ steps.ver.outputs.version }}-release.md5"

      - name: Build SmoothMine Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk "out/SmoothMine-${{ steps.ver.outputs.version }}-debug.apk"
          md5sum "out/SmoothMine-${{ steps.ver.outputs.version }}-debug.apk" > "out/SmoothMine-${{ steps.ver.outputs.version }}-debug.md5"

      - name: Upload SmoothMine Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothMine-Release-APK
          path: out/*-release.*

      - name: Upload SmoothMine Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothMine-Debug-APK
          path: out/*-debug.*

      - name: Auto-Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk out/*.md5 --clobber
          else
            gh release create "$TAG" out/*.apk out/*.md5 \
              --title "SmoothMine Launcher $TAG" \
              --generate-notes
          fi
